<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Docker Compose Playwright SIT run reconstruction</title>
<desc id="desc">Reconstructed terminal view of the Kubuntu Tester running docker compose run --rm playwright. The official Microsoft Playwright 1.64.1 image executed ten deployed-SIT tests using four workers; all ten passed in 5.8 seconds.</desc>
<rect width="1440" height="820" rx="22" fill="#10151d"/>
<rect width="1440" height="76" rx="22" fill="#1b2430"/>
<rect y="54" width="1440" height="22" fill="#1b2430"/>
<circle cx="35" cy="38" r="7" fill="#ff6259"/><circle cx="60" cy="38" r="7" fill="#ffc044"/><circle cx="85" cy="38" r="7" fill="#45c96a"/>
<text x="120" y="45" fill="#dce5ef" font-family="Arial,sans-serif" font-size="22" font-weight="700">QUALITYPEOPLE / QA LAB DOCKER RUN</text>
<rect x="1080" y="22" width="315" height="32" rx="6" fill="#263444" stroke="#4a647c"/>
<text x="1237" y="43" fill="#a8c7e8" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">RECORDED RUN RECONSTRUCTION</text>
<rect x="58" y="116" width="1322" height="624" rx="12" fill="#0b0f14" stroke="#303b49"/>
<rect x="58" y="116" width="1322" height="50" rx="12" fill="#171f2a"/>
<rect x="58" y="150" width="1322" height="16" fill="#171f2a"/>
<circle cx="86" cy="141" r="5" fill="#7e8b99"/>
<text x="105" y="146" fill="#c5d0dc" font-family="monospace" font-size="15">terminal — qualitypeople-qa-lab · Kubuntu Tester</text>
<text x="1338" y="146" fill="#7e8b99" font-family="monospace" font-size="13" text-anchor="end">container exit code: 0</text>
<g font-family="monospace" font-size="19">
<text x="92" y="214" fill="#7ee787">cormac@cormac-linux-mini</text>
<text x="430" y="214" fill="#dce5ef">$ docker compose run --rm playwright</text>
<text x="92" y="264" fill="#a8c7e8">$ npm ci &amp;&amp; npx playwright test</text>
<text x="92" y="309" fill="#dce5ef">added 3 packages, and audited 4 packages in 1s</text>
<text x="92" y="359" fill="#7ee787">Running 10 tests using 4 workers</text>
<text x="92" y="405" fill="#7ee787">✓  1  Contact form validation</text>
<text x="92" y="442" fill="#7ee787">✓  2  Contact form invalid email</text>
<text x="92" y="479" fill="#7ee787">✓  3  Contact form simulated API failure</text>
<text x="92" y="516" fill="#7ee787">✓  4  Contact form simulated success</text>
<text x="92" y="553" fill="#7ee787">✓  5–8  Homepage and navigation checks</text>
<text x="92" y="590" fill="#7ee787">✓  9–10  SIT response and version endpoint</text>
<line x1="92" y1="625" x2="1342" y2="625" stroke="#303b49"/>
<text x="92" y="674" fill="#7ee787" font-weight="700">10 passed (5.8s)</text>
<text x="1338" y="674" fill="#8b949e" text-anchor="end">Playwright 1.64.1 · 4 workers</text>
</g>
<text x="58" y="780" fill="#7f8d9c" font-family="Arial,sans-serif" font-size="13">Reconstructed terminal view based on the recorded 11 November 2026 run — not a literal terminal screenshot. Contact-form API responses were mocked.</text>
