<text x="968" y="445" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="24" font-weight="700">Deployed application</text>
<text x="968" y="482" fill="#b5c4b8" font-family="Arial,sans-serif" font-size="15">• QualityPeople frontend</text>
<text x="968" y="514" fill="#b5c4b8" font-family="Arial,sans-serif" font-size="15">• Pages Functions API</text>
<text x="968" y="546" fill="#b5c4b8" font-family="Arial,sans-serif" font-size="15">• Outside the Docker host</text>
<text x="968" y="588" fill="#b7f56a" font-family="monospace" font-size="14">qualitypeople-sit.pages.dev</text>

<path d="M850 480 H925" fill="none" stroke="#b7f56a" stroke-width="3"/>
<path d="M910 468 L925 480 L910 492" fill="none" stroke="#b7f56a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="888" y="455" fill="#b7f56a" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">HTTPS</text>

<rect x="100" y="650" width="1240" height="35" rx="6" fill="#202a35"/>
<text x="720" y="673" fill="#a9b7c5" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Test runner container only · application stays on Cloudflare Pages · reports persist on Kubuntu</text>
<text x="58" y="758" fill="#7f8d9c" font-family="Arial,sans-serif" font-size="13">Architecture reflects the verified QA Lab setup. Future application containerisation on the M4 is a separate, deferred development task.</text>
