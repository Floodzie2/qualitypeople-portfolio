<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">AI enquiry triage evaluation results reconstruction</title><desc id="desc">Results from a local evaluation using 12 synthetic cases. The raw model passed 11 of 12; deterministic safety post-processing produced 12 of 12 final cases passing under the current checks.</desc><rect width="1440" height="820" rx="22" fill="#10151d"/><rect width="1440" height="78" rx="22" fill="#1b2430"/><rect y="56" width="1440" height="22" fill="#1b2430"/><circle cx="35" cy="39" r="7" fill="#ff6259"/><circle cx="60" cy="39" r="7" fill="#ffc044"/><circle cx="85" cy="39" r="7" fill="#45c96a"/><text x="120" y="46" fill="#dce5ef" font-family="Arial,sans-serif" font-size="22" font-weight="700">QUALITYPEOPLE / AI EVALUATION</text><rect x="1110" y="23" width="285" height="32" rx="6" fill="#263444" stroke="#4a647c"/><text x="1252" y="44" fill="#a8c7e8" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">LOCAL RUN RECONSTRUCTION</text><text x="58" y="135" fill="#8b9aaa" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">EXPERIMENT V13 · SYNTHETIC GOLDEN DATASET</text><text x="58" y="184" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="34" font-weight="700">Evaluate raw output and safety controls separately</text><rect x="58" y="224" width="630" height="172" rx="12" fill="#1a222d" stroke="#3a4554"/><text x="88" y="262" fill="#9eabb9" font-family="Arial,sans-serif" font-size="13" letter-spacing="1">RAW MODEL CANDIDATE</text><text x="88" y="319" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="48" font-weight="700">11 / 12</text><text x="88" y="353" fill="#e5bd76" font-family="Arial,sans-serif" font-size="17" font-weight="700">91.7% cases passed</text><text x="410" y="300" fill="#9eabb9" font-family="Arial,sans-serif" font-size="14">One known miss:</text><text x="410" y="324" fill="#e5bd76" font-family="Arial,sans-serif" font-size="14">confirmed event date</text><text x="410" y="348" fill="#9eabb9" font-family="Arial,sans-serif" font-size="13">omitted from follow-up</text><rect x="720" y="224" width="660" height="172" rx="12" fill="#18291f" stroke="#4f7d5a"/><text x="750" y="262" fill="#9eabb9" font-family="Arial,sans-serif" font-size="13" letter-spacing="1">FINAL API RESULT AFTER SAFETY POST-PROCESSING</text><text x="750" y="319" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="48" font-weight="700">12 / 12</text><text x="750" y="353" fill="#b7f56a" font-family="Arial,sans-serif" font-size="17" font-weight="700">100% passed current checks</text><text x="1100" y="300" fill="#b5c4b8" font-family="Arial,sans-serif" font-size="14">Narrow override adds</text><text x="1100" y="324" fill="#b5c4b8" font-family="Arial,sans-serif" font-size="14">the missing required</text><text x="1100" y="348" fill="#b5c4b8" font-family="Arial,sans-serif" font-size="14">follow-up detail</text><text x="58" y="448" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="21" font-weight="700">Final checks · all 12 synthetic cases</text><g font-family="Arial,sans-serif"><rect x="58" y="472" width="1322" height="44" rx="7" fill="#1a222d"/><text x="82" y="500" fill="#dce5ef" font-size="15">Schema validity</text><rect x="900" y="487" width="300" height="10" rx="5" fill="#303b49"/><rect x="900" y="487" width="300" height="10" rx="5" fill="#b7f56a"/><text x="1338" y="500" fill="#b7f56a" font-size="14" font-weight="700" text-anchor="end">100%</text><rect x="58" y="524" width="1322" height="44" rx="7" fill="#1a222d"/><text x="82" y="552" fill="#dce5ef" font-size="15">Category accuracy</text><rect x="900" y="539" width="300" height="10" rx="5" fill="#303b49"/><rect x="900" y="539" width="300" height="10" rx="5" fill="#b7f56a"/><text x="1338" y="552" fill="#b7f56a" font-size="14" font-weight="700" text-anchor="end">100%</text><rect x="58" y="576" width="1322" height="44" rx="7" fill="#1a222d"/><text x="82" y="604" fill="#dce5ef" font-size="15">Summary-anchor coverage</text><rect x="900" y="591" width="300" height="10" rx="5" fill="#303b49"/><rect x="900" y="591" width="300" height="10" rx="5" fill="#b7f56a"/><text x="1338" y="604" fill="#b7f56a" font-size="14" font-weight="700" text-anchor="end">100%</text><rect x="58" y="628" width="1322" height="44" rx="7" fill="#1a222d"/><text x="82" y="656" fill="#dce5ef" font-size="15">Missing-information recall</text><rect x="900" y="643" width="300" height="10" rx="5" fill="#303b49"/><rect x="900" y="643" width="300" height="10" rx="5" fill="#b7f56a"/><text x="1338" y="656" fill="#b7f56a" font-size="14" font-weight="700" text-anchor="end">100%</text><rect x="58" y="680" width="1322" height="44" rx="7" fill="#1a222d"/><text x="82" y="708" fill="#dce5ef" font-size="15">Human-review accuracy</text><rect x="900" y="695" width="300" height="10" rx="5" fill="#303b49"/><rect x="900" y="695" width="300" height="10" rx="5" fill="#b7f56a"/><text x="1338" y="708" fill="#b7f56a" font-size="14" font-weight="700" text-anchor="end">100%</text><text x="58" y="775" fill="#7f8d9c" font-family="Arial,sans-serif" font-size="13">Recreated from the recorded local v13 experiment. Small synthetic dataset; not a general real-world accuracy claim.</text></svg>